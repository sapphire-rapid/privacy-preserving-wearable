name: site

# Builds the project site (website/ at the root, MkDocs docs under /docs/)
# and publishes it to the gh-pages branch.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "mkdocs.yml"
      - "firmware/mesh/README.md"
      - "hardware/README.md"
      - "ml/fall-detection/README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs<2" "mkdocs-material<10" mkdocs-include-markdown-plugin ghp-import
      - name: Build
        run: |
          mkdocs build --strict -d _site/docs
          cp -r website/. _site/
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ghp-import --no-jekyll --push --force -m "Deploy site from ${GITHUB_SHA}" _site
